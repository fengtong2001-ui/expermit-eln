name: Build macOS 27 Native App (.app & .dmg)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    name: Build ExPermit for macOS 27 (Universal Binary + DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies & run unit tests
        run: |
          # 不用 npm ci：npm 11 的 lock 缺 Tailwind oxide wasm32 条目（见 HANDOFF 坑④）
          npm install
          npm test

      - name: Build macOS 27 Universal App & DMG
        run: |
          chmod +x native/mac/build.sh
          ./native/mac/build.sh --universal

      - name: Run macOS Native App Self-Test
        run: |
          ./native/mac/ExPermit.app/Contents/MacOS/ExPermit --selftest

      - name: Archive ExPermit.app (preserving macOS signatures & symlinks)
        run: |
          ditto -c -k --sequesterRsrc --keepParent native/mac/ExPermit.app native/mac/ExPermit-macOS27-App.zip

      - name: Upload ExPermit-macOS27.dmg & App Bundle to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExPermit-macOS27-Universal
          path: |
            native/mac/ExPermit-macOS27.dmg
            native/mac/ExPermit-macOS27-App.zip
          if-no-files-found: error
